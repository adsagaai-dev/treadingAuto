[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treading-auto"
version = "0.1.0"
description = "Trading automation starter for treadingAuto"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]

[project.scripts]
treading-auto = "treading_auto.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/treading_auto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
